test:
  # Исследовательский вопрос: один стейт (дефект «нет пустой строки после
  # заголовка», тот же текст, что state 1 в one-sense-forms.yaml) и один факт,
  # заданный 9 разными формулировками вопроса. Варьируется только вопрос:
  # база / реверс порядка ответов / дефект-формулировка / соответствие правилу /
  # отрицание / другие критерии / идентификация границы / структурный вердикт /
  # score-шкала.
  # Ожидание: все формулировки несут один факт, но полярность ответа разная —
  # blank_line=no, _rev=no, _defect=yes, _rule=no, _neg=yes, _criteria=no,
  # _ident=direct, _verdict=violated, _score=нарушено (низ шкалы).
  states:
    - |
      #42 [AI] Добавил валидацию спеки decision-tests
      - Подключил msgspec к загрузке YAML-спеки.
      - Добавил краш на неизвестные поля секции test.
  questions:
    # база (идентичен вопросу из one-sense-forms.yaml — склейка между файлами)
    - name: blank_line
      q: "Есть ли пустая строка между заголовком коммита и блоком объяснения под ним?"
      answers:
        "yes": "между заголовком и объяснением есть пустая строка"
        "no": "объяснение начинается сразу под заголовком, пустой строки нет"
    # та же формулировка, порядок вариантов обратный (чувствительность к порядку)
    - name: blank_line_rev
      q: "Есть ли пустая строка между заголовком коммита и блоком объяснения под ним?"
      answers:
        "no": "объяснение начинается сразу под заголовком, пустой строки нет"
        "yes": "между заголовком и объяснением есть пустая строка"
    # полярность инвертирована: вопрос о дефекте
    - name: blank_line_defect
      q: "Допущен ли в коммите дефект оформления «нет пустой строки между заголовком и объяснением»?"
      answers:
        "yes": "дефект присутствует: пустой строки нет"
        "no": "дефекта нет: пустая строка на месте"
    # другой глагол: соответствие правилу
    - name: blank_line_rule
      q: "Соответствует ли коммит правилу «после заголовка — пустая строка»?"
      answers:
        "yes": "правило выполняется"
        "no": "правило нарушено"
    # отрицательная форма вопроса (намеренный негатив-кейс)
    - name: blank_line_neg
      q: "Нет ли пустой строки между заголовком и объяснением?"
      answers:
        "yes": "пустой строки действительно нет"
        "no": "пустая строка есть"
    # те же да/нет, но критерии переспецифицированы иначе
    - name: blank_line_criteria
      q: "Есть ли пустая строка между заголовком коммита и блоком объяснения под ним?"
      answers:
        "yes": "первая строка после заголовка — пустая; объяснение начинается со второй"
        "no": "первая строка после заголовка не пустая — это уже текст объяснения"
    # не да/нет, а идентификация объекта наблюдения
    - name: blank_line_ident
      q: "Как выглядит граница между заголовком коммита и первым пунктом объяснения?"
      answers:
        empty_line: "между ними вставлена пустая строка"
        direct: "первый пункт идёт сразу под заголовком, без пустой строки"
    # структурный вердикт: другая пара вариантов вместо да/нет
    - name: blank_line_verdict
      q: "Проверь правило: после заголовка коммита должна идти пустая строка перед объяснением. Каков результат проверки?"
      answers:
        violated: "правило нарушено — пустой строки нет"
        ok: "правило выполнено — пустая строка есть"
    # та же проверка, но на шкале вместо выбора
    - name: blank_line_score
      q: "Насколько коммит соответствует правилу «после заголовка — пустая строка»?"
      type: score
      answers:
        - нарушено
        - частично
        - выполнено
