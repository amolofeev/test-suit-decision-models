test:
  # Исследовательский вопрос: различает ли decision-модель структурные дефекты
  # коммита по правилам корневого AGENTS.md и уверенно ли отвергает нарушения.
  # Формат коммита: "#<id> [AI] <краткое резюме>", пустая строка, затем подробное
  # объяснение пунктом на строку.
  states:
    # эталон: всё по формату
    - |
      #42 [AI] Добавил валидацию спеки decision-tests

      - Подключил msgspec к загрузке YAML-спеки.
      - Добавил краш на неизвестные поля секции test.
    # без префикса [AI]
    - |
      #42 Добавил валидацию спеки decision-tests

      - Подключил msgspec к загрузке YAML-спеки.
      - Добавил краш на неизвестные поля секции test.
    # без идентификатора задачи
    - |
      [AI] Добавил валидацию спеки decision-tests

      - Подключил msgspec к загрузке YAML-спеки.
      - Добавил краш на неизвестные поля секции test.
    # без подробного объяснения
    - |
      #42 [AI] Добавил валидацию спеки decision-tests
    # без пустой строки между заголовком и объяснением
    - |
      #42 [AI] Добавил валидацию спеки decision-tests
      - Подключил msgspec к загрузке YAML-спеки.
      - Добавил краш на неизвестные поля секции test.
    # объяснение сплошным абзацем вместо пунктов
    - |
      #42 [AI] Добавил валидацию спеки decision-tests

      Подключил msgspec к загрузке YAML-спеки и добавил краш на неизвестные поля секции test.
    # префикс в нижнем регистре
    - |
      #42 [ai] Добавил валидацию спеки decision-tests

      - Подключил msgspec к загрузке YAML-спеки.
    # идентификатор не первым — перед ним текст
    - |
      Спринт 12: #42 [AI] Добавил валидацию спеки decision-tests

      - Подключил msgspec к загрузке YAML-спеки.
    # префикс [AI] в конце заголовка вместо начала
    - |
      #42 Добавил валидацию спеки decision-tests [AI]

      - Подключил msgspec к загрузке YAML-спеки.
    # два пункта сжаты в одну строку
    - |
      #42 [AI] Добавил валидацию спеки decision-tests

      - Подключил msgspec к загрузке YAML-спеки; добавил краш на неизвестные поля секции test.
    # заголовок без резюме
    - |
      #42 [AI]

      - Подключил msgspec к загрузке YAML-спеки.
    # --- цепочка пошагового наполнения контекста (осознанные A/B-стейты, не дубли) ---
    # формат: объект commit = text (сам коммит) + бинарные метаданные-ответы
    # (yes/no на каждый вопрос о соответствии правилам). Каждый следующий стейт =
    # предыдущий + один новый флаг-ответ: имитация, что ответ на вопрос дописан
    # в стейт и передан на вход следующему вопросу.
    # шаг 1: только текст коммита, проверок пока нет
    - commit:
        text: "#77 [AI] Переименовал вопрос urgency в urgent\n\n- Переименовал name вопроса в спеке.\n- Оставил один вопрос, чтобы не плодить дубль стейта."
    # шаг 2: + результат проверки has_id
    - commit:
        text: "#77 [AI] Переименовал вопрос urgency в urgent\n\n- Переименовал name вопроса в спеке.\n- Оставил один вопрос, чтобы не плодить дубль стейта."
        has_id: "yes"
    # шаг 3: + результат проверки has_ai_prefix
    - commit:
        text: "#77 [AI] Переименовал вопрос urgency в urgent\n\n- Переименовал name вопроса в спеке.\n- Оставил один вопрос, чтобы не плодить дубль стейта."
        has_id: "yes"
        has_ai_prefix: "yes"
    # шаг 4: + результат проверки has_summary
    - commit:
        text: "#77 [AI] Переименовал вопрос urgency в urgent\n\n- Переименовал name вопроса в спеке.\n- Оставил один вопрос, чтобы не плодить дубль стейта."
        has_id: "yes"
        has_ai_prefix: "yes"
        has_summary: "yes"
    # шаг 5: + результат проверки has_explanation (все проверки заполнены)
    - commit:
        text: "#77 [AI] Переименовал вопрос urgency в urgent\n\n- Переименовал name вопроса в спеке.\n- Оставил один вопрос, чтобы не плодить дубль стейта."
        has_id: "yes"
        has_ai_prefix: "yes"
        has_summary: "yes"
        has_explanation: "yes"
    # шаг 6: вместо поштучных проверок — один общий бинарный вердикт
    # «соответствует ли коммит правилам»
    - commit:
        text: "#78 [AI] Дописал в спеку общий вердикт оформления\n\n- Добавил стейт с метой follows_rules.\n- Вопросы не менял: они остаются поштучными проверками."
        has_id: "yes"
        has_ai_prefix: "yes"
        has_summary: "yes"
        has_explanation: "yes"
        follows_rules: "yes"
    # скам: текст откровенно нарушает все правила, а метадата утверждает,
    # что всё хорошо — война текста и полей
    - commit:
        text: "fix\n\nа ещё я почистил логи и убрал старый код наверно"
        has_id: "yes"
        has_ai_prefix: "yes"
        has_summary: "yes"
        has_explanation: "yes"
        follows_rules: "yes"
    # --- A/B-пара: один и тот же контекст (правила + задача + текст коммита),
    # одна версия строкой, вторая объектом. Разница только в форме подачи.
    # текстовая версия
    - |
      Правила оформления коммитов:
      1. Заголовок: #<id> [AI] <краткое резюме задачи>.
      2. После заголовка — пустая строка.
      3. Подробное объяснение: что сделано и почему, каждый пункт отдельной строкой.

      Задача: проверь, оформлен ли коммит ниже по этим правилам.

      Коммит:
      #79 Добавил автоформатер коммитов

      - Подключил руф в CI.
      - Выключил правило, которое ломает длинные строки.
    # объектная версия: тот же контекст полями объекта
    - commit:
        rules: "1. Заголовок: #<id> [AI] <краткое резюме задачи>.\n2. После заголовка — пустая строка.\n3. Подробное объяснение: что сделано и почему, каждый пункт отдельной строкой."
        task: "проверь, оформлен ли коммит ниже по этим правилам"
        text: "#79 Добавил автоформатер коммитов\n\n- Подключил руф в CI.\n- Выключил правило, которое ломает длинные строки."
    # --- ID-инвариант: чистый смысловой тест ---
    # форма, контекст и весь текст зафиксированы; меняется только значение ID —
    # в поле issue_id (ось A) или в начале текста (ось B, наоборот), микро/макро.
    # Ожидание: все вопросы кроме id_match инвариантны к ID; id_match обязан
    # различать match/mismatch — контроль чувствительности теста.
    # база: ID в поле и в тексте совпадают
    - commit:
        text: "#101 [AI] Обновил настройки линтера\n\n- Поправил правило для длинных строк.\n- Обновил .editorconfig."
        issue_id: "101"
    # ось A, микро: ID в поле на 1 больше, текст тот же
    - commit:
        text: "#101 [AI] Обновил настройки линтера\n\n- Поправил правило для длинных строк.\n- Обновил .editorconfig."
        issue_id: "102"
    # ось A, макро: ID в поле радикально другой, текст тот же
    - commit:
        text: "#101 [AI] Обновил настройки линтера\n\n- Поправил правило для длинных строк.\n- Обновил .editorconfig."
        issue_id: "9999"
    # ось B, микро: ID в поле тот же, ID в тексте на 1 больше
    - commit:
        text: "#102 [AI] Обновил настройки линтера\n\n- Поправил правило для длинных строк.\n- Обновил .editorconfig."
        issue_id: "101"
    # ось B, макро: ID в поле тот же, в тексте радикально другой ID
    - commit:
        text: "#9999 [AI] Обновил настройки линтера\n\n- Поправил правило для длинных строк.\n- Обновил .editorconfig."
        issue_id: "101"
  questions:
    - name: has_id
      q: "Начинается ли сообщение коммита с идентификатора задачи вида #42 (символ # вплотную к числу, в самом начале строки)?"
      answers:
        "yes": "первый токен сообщения — # с номером задачи"
        "no": "идентификатора нет, он не в начале или набран без #"
    - name: has_ai_prefix
      q: "Есть ли в начале заголовка коммита (после идентификатора задачи) точный префикс [AI] в квадратных скобках и верхнем регистре?"
      answers:
        "yes": "после идентификатора стоит [AI]"
        "no": "префикса нет, он в нижнем регистре или стоит не в начале заголовка"
    - name: has_summary
      q: "Есть ли после идентификатора и префикса краткое резюме задачи в том же первом абзаце?"
      answers:
        "yes": "в заголовке после идентификатора идёт текст резюме"
        "no": "после идентификатора и префикса резюме отсутствует"
    - name: has_explanation
      q: "Есть ли в коммите подробное объяснение — отдельный блок текста под заголовком, описывающий, что сделано и почему?"
      answers:
        "yes": "под заголовком есть блок объяснения"
        "no": "коммит состоит только из заголовка"
    # v2: операционный критерий — только наблюдаемый признак, без «и почему»
    # (эксперимент: снизит ли долю дисперсии «модель» 44% и даст консенсус)
    - name: has_explanation_v2
      q: "Есть ли в сообщении коммита после заголовка и пустой строки отдельный блок текста (строки, не являющиеся частью заголовка)?"
      answers:
        "yes": "после заголовка есть отдельные строки текста"
        "no": "после заголовка нет строк текста — сообщение заканчивается заголовком"
    # смысловой контроль ID-инварианта: обязан различать match/mismatch/no_field
    - name: id_match
      q: "В стейте есть поле issue_id (ID задачи). Совпадает ли оно с ID, указанным в начале текста коммита вида #101?"
      answers:
        match: "поле issue_id есть и числом равно ID из текста коммита"
        mismatch: "поле issue_id есть, но его число отличается от ID в тексте"
        no_id_field: "в стейте нет поля issue_id — сравнивать нечего"
    - name: defect
      q: "Какой единственный структурный дефект оформления коммита допущен? Если дефектов несколько — выбери тот, что ближе к началу сообщения."
      answers:
        none: "коммит оформлен целиком по формату"
        id_missing: "в начале нет идентификатора задачи #<число>"
        id_not_first: "идентификатор есть, но перед ним стоит другой текст"
        prefix_missing: "нет префикса [AI] в начале заголовка"
        prefix_wrong_place: "[AI] стоит не в начале заголовка"
        summary_missing: "после идентификатора нет резюме задачи"
        blank_line_missing: "нет пустой строки между заголовком и объяснением"
        explanation_missing: "нет подробного объяснения под заголовком"
        explanation_not_bulleted: "объяснение есть, но не разбито на отдельные пункты-строки"
    - name: defect_rev
      q: "Какой единственный структурный дефект оформления коммита допущен? Если дефектов несколько — выбери тот, что ближе к началу сообщения."
      answers:
        explanation_not_bulleted: "объяснение есть, но не разбито на отдельные пункты-строки"
        explanation_missing: "нет подробного объяснения под заголовком"
        blank_line_missing: "нет пустой строки между заголовком и объяснением"
        summary_missing: "после идентификатора нет резюме задачи"
        prefix_wrong_place: "[AI] стоит не в начале заголовка"
        prefix_missing: "нет префикса [AI] в начале заголовка"
        id_not_first: "идентификатор есть, но перед ним стоит другой текст"
        id_missing: "в начале нет идентификатора задачи #<число>"
        none: "коммит оформлен целиком по формату"
    - name: severity
      q: "Насколько серьёзен дефект оформления коммита с точки зрения правил репозитория?"
      type: score
      answers:
        - valid
        - cosmetic
        - reject
