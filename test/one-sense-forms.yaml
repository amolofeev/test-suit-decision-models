test:
  # Исследовательский вопрос: один и тот же смысл — «в коммите между заголовком
  # и объяснением НЕТ пустой строки» — в разных формах и обёртках. Один вопрос.
  # Смысл во всех 12 стейтах идентичен; варьируется только подача:
  # текст / код-блок / правила+задача / объект / объект с метаданными /
  # JSON-строка / верхний регистр / пустая строка внутри объяснения /
  # английский / пояснительная вставка / список строк.
  # Ожидание: ответ blank_line="no" на всех стейтах, стабильные вероятности.
  states:
    # 1. чистый текст (база)
    - |
      #42 [AI] Добавил валидацию спеки decision-tests
      - Подключил msgspec к загрузке YAML-спеки.
      - Добавил краш на неизвестные поля секции test.
    # 2. обёртка: markdown-блок кода
    - |
      ```text
      #42 [AI] Добавил валидацию спеки decision-tests
      - Подключил msgspec к загрузке YAML-спеки.
      - Добавил краш на неизвестные поля секции test.
      ```
    # 3. обёртка: правила + задача вокруг коммита
    - |
      Правила оформления коммитов:
      1. Заголовок: #<id> [AI] <краткое резюме задачи>.
      2. После заголовка — пустая строка.
      3. Подробное объяснение пунктом на строку.

      Задача: проверь соблюдение правил.

      Коммит:
      #42 [AI] Добавил валидацию спеки decision-tests
      - Подключил msgspec к загрузке YAML-спеки.
      - Добавил краш на неизвестные поля секции test.
    # 4. объект: только текст
    - commit:
        text: "#42 [AI] Добавил валидацию спеки decision-tests\n- Подключил msgspec к загрузке YAML-спеки.\n- Добавил краш на неизвестные поля секции test."
    # 5. объект: текст + нейтральные метаданные (без вердиктов)
    - commit:
        text: "#42 [AI] Добавил валидацию спеки decision-tests\n- Подключил msgspec к загрузке YAML-спеки.\n- Добавил краш на неизвестные поля секции test."
        priority: critical
        tier: enterprise
        channel: git
    # 6. объект: текст + правила + задача полями
    - commit:
        rules: "1. Заголовок: #<id> [AI] <краткое резюме задачи>.\n2. После заголовка — пустая строка.\n3. Подробное объяснение пунктом на строку."
        task: "проверь соблюдение правил"
        text: "#42 [AI] Добавил валидацию спеки decision-tests\n- Подключил msgspec к загрузке YAML-спеки.\n- Добавил краш на неизвестные поля секции test."
    # 7. JSON-строка (тот же объект, но человекочитаемый — как текст)
    - |
      {
        "commit": {
          "text": "#42 [AI] Добавил валидацию спеки decision-tests\n- Подключил msgspec к загрузке YAML-спеки.\n- Добавил краш на неизвестные поля секции test."
        }
      }
    # 8. верхний регистр всего текста
    - |
      #42 [AI] ДОБАВИЛ ВАЛИДАЦИЮ СПЕКИ DECISION-TESTS
      - ПОДКЛЮЧИЛ MSGSPEC К ЗАГРУЗКЕ YAML-СПЕКИ.
      - ДОБАВИЛ КРАШ НА НЕИЗВЕСТНЫЕ ПОЛЯ СЕКЦИИ TEST.
    # 9. пустая строка внутри объяснения (граница заголовок/объяснение та же)
    - |
      #42 [AI] Добавил валидацию спеки decision-tests
      - Подключил msgspec к загрузке YAML-спеки.

      - Добавил краш на неизвестные поля секции test.
    # 10. английский текст с тем же дефектом
    - |
      #42 [AI] Added spec validation for decision-tests
      - Connected msgspec to load the YAML spec.
      - Added a crash on unknown fields in the test section.
    # 11. пояснительная строка сразу под заголовком (пустой строки нет)
    - |
      #42 [AI] Добавил валидацию спеки decision-tests
      (первый блок идёт сразу под заголовком)
      - Подключил msgspec к загрузке YAML-спеки.
      - Добавил краш на неизвестные поля секции test.
    # 12. объект: текст разбит на список строк
    - commit:
        lines:
          - "#42 [AI] Добавил валидацию спеки decision-tests"
          - "- Подключил msgspec к загрузке YAML-спеки."
          - "- Добавил краш на неизвестные поля секции test."
  questions:
    - name: blank_line
      q: "Есть ли пустая строка между заголовком коммита и блоком объяснения под ним?"
      answers:
        "yes": "между заголовком и объяснением есть пустая строка"
        "no": "объяснение начинается сразу под заголовком, пустой строки нет"
